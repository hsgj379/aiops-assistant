# =====================================================================
# local profile —— 本地开发（Windows 本机 mvn spring-boot:run）
#
# 中间件：MySQL 为 Windows 本机安装；Redis / RabbitMQ 为 Docker 映射到本机的端口
# 全部通过 127.0.0.1 访问。凭据只从环境变量读取，本文件不含任何密码。
# =====================================================================

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:aiops_assistant}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:aiops}
    password: ${MYSQL_PASSWORD:}

  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DB:0}

  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:aiops}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}

logging:
  level:
    com.aiops.assistant: DEBUG
