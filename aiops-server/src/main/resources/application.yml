server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml

spring:
  application:
    name: aiops-server
  # 默认走本地开发 profile（local）；容器化部署时用 SPRING_PROFILES_ACTIVE=docker 覆盖
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

  # 数据源公共部分：url / username / password 由 profile 提供，此处不放任何密码
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    open-in-view: false

  # 连接池与监听参数为两种环境共用，host / port / 凭据见 application-{profile}.yml
  redis:
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2
        max-wait: 3000ms

  rabbitmq:
    connection-timeout: 5000ms
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        concurrency: 2
        max-concurrency: 8

# Actuator：仅暴露 health / info，不公开 env、metrics 等可能泄露环境信息与密钥的端点
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  health:
    # 基础 health 只反映应用自身存活；中间件连通性不混入，避免 503 噪音与拓扑泄露
    redis:
      enabled: false
    db:
      enabled: false

logging:
  level:
    root: INFO
    com.aiops.assistant: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/aiops-server.log

# App
aiops:
  llm:
    # 阿里云百炼（OpenAI 兼容 API）
    api-key: ${DASHSCOPE_API_KEY:}
    base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    model: ${DASHSCOPE_MODEL:qwen-plus}
