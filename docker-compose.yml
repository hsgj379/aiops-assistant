# =====================================================================
# AI DevOps Assistant - Docker Compose
# 中间件编排：Redis 7 / RabbitMQ 3 (management)
#
# 说明：MySQL 不在 Compose 中管理，使用本机已安装的 MySQL 8（127.0.0.1:3306）
#
# 启动前必须先提供密码（不得使用仓库中的默认值）：
#   PowerShell:  $env:RABBITMQ_PASSWORD = "<你的MQ密码>"
#   Bash:        export RABBITMQ_PASSWORD="<你的MQ密码>"
#   docker compose up -d
#
# 停止：docker compose down        （保留数据卷 ./docker-data）
# 销毁：docker compose down -v     （连同数据清空，请谨慎）
# =====================================================================

name: aiops-assistant

services:
  # ---------- Redis 7 ----------
  redis:
    image: redis:7.2-alpine
    container_name: aiops-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    command:
      - redis-server
      - --appendonly yes
      - --save 900 1
      - --save 300 10
      - --save 60 10000
      - --maxmemory 256mb
      - --maxmemory-policy allkeys-lru
    # 端口仅绑定本机 127.0.0.1，容器内网络仍可互通
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    networks:
      - aiops-net

  # ---------- RabbitMQ 3 (management) ----------
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: aiops-rabbitmq
    restart: unless-stopped
    environment:
      # 独立 aiops 用户，不使用默认 guest
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-aiops}
      # 密码必须显式提供，缺失时 compose 直接报错，避免弱默认密码入库
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD 未设置}
      TZ: Asia/Shanghai
    # 端口仅绑定本机 127.0.0.1，容器内网络仍可互通
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - ./docker-data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    mem_limit: 768m
    networks:
      - aiops-net

networks:
  aiops-net:
    name: aiops-net
    driver: bridge
